[package]
name = "rugit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rugit"
path = "src/main.rs"

[dependencies]
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
crossterm  = "0.29"
git2       = "0.21"
notify     = "8"
ratatui    = "0.30"
serde      = { version = "1", features = ["derive"] }
similar    = { version = "3", features = ["text"] }
toml       = "1"
tui-textarea = { package = "tui-textarea-2", version = "0.13", features = ["crossterm"] }
unicode-width = "0.2"
